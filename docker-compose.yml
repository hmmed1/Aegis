services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    image: aegis-backend
    container_name: aegis-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  sensor:
    build:
      context: .
      dockerfile: sensor.Dockerfile
    image: aegis-sensor
    container_name: aegis-sensor
    # Host networking gives scapy a real view of host interfaces/traffic,
    # which is required for accurate capture and ARP sweeps.
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      SENSOR_ID: ${SENSOR_ID:-home-pc}
      SENSOR_KEY: ${SENSOR_KEY:-changeme}
      SERVER_URL: ${SERVER_URL:-http://localhost:8000}
      IFACE: ${IFACE:-}
      SUBNET: ${SUBNET:-192.168.1.0/24}
    depends_on:
      - backend
    restart: unless-stopped
