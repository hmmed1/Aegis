
stages:
  - test
  - security


test:
  stage: test
  image: python:3.12-slim 
  before_script:
    - pip install -r backend/requirements.txt
  script:
    - python -m pytest backend/tests -v
  artifacts:
    when: always
    reports:
      junit: report.xml  

security-scan:
  stage: security
  image: python:3.12-slim
  script:
    - pip install bandit
    - bandit -r backend/ -f json -o bandit-report.json || true
  artifacts:
    when: always
    paths:
      - bandit-report.json