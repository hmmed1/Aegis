<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<title>AEGIS // Sign In</title>
<link rel="icon" type="image/svg+xml" href="assets/aegis-icon-v2.svg">
<style>
  :root {
    --bg-void:      #0a0a0a;
    --bg-panel:     #131313;
    --hazard:       #FFC300;
    --hazard-dim:   #7a5c00;
    --hazard-line:  rgba(255, 195, 0, 0.25);
    --text-primary: #e9e9e9;
    --text-muted:   #6f6f6f;
    --danger:       #ff4d4d;
    --font-mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Consolas,
                 "Liberation Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-void);
    color: var(--text-primary);
    font-family: var(--font-mono);
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .bg-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .login-panel {
    position: relative;
    z-index: 1;
    width: min(380px, 92vw);
    background: var(--bg-panel);
    border: 1px solid var(--hazard-line);
    border-radius: 4px;
    padding: 40px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo-shield {
    width: 64px;
    height: 64px;
    object-fit: contain;
    margin-bottom: 16px;
    filter: drop-shadow(0 0 14px rgba(255, 195, 0, 0.25));
  }

  .brand {
    font-size: 20px;
    font-weight: 700;
    color: var(--hazard);
    letter-spacing: 0.1em;
    margin-bottom: 30px;
  }

  form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  .field input {
    background: var(--bg-void);
    border: 1px solid var(--hazard-line);
    border-radius: 3px;
    padding: 11px 12px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.02em;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .field input::placeholder {
    color: #4a4a4a;
  }

  .field input:focus {
    border-color: var(--hazard);
    box-shadow: 0 0 0 3px rgba(255, 195, 0, 0.1);
  }

  .submit-btn {
    margin-top: 6px;
    background: var(--hazard);
    color: #0a0a0a;
    border: none;
    border-radius: 3px;
    padding: 12px;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  .submit-btn:hover { background: #ffd633; }
  .submit-btn:active { transform: scale(0.98); }

  .error-msg {
    display: none;
    font-size: 11px;
    color: var(--danger);
    letter-spacing: 0.03em;
    text-align: center;
  }

  .error-msg.visible { display: block; }
</style>

<div class="login-panel">
  <img class="logo-shield" src="assets/aegis-icon-v2.svg" alt="AEGIS shield logo">
  <div class="brand">AEGIS</div>

  <form id="login-form">
    <div class="field">
      <label for="username">OPERATOR ID</label>
      <input type="text" id="username" name="username" placeholder="operator@aegis.local" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">PASSPHRASE</label>
      <input type="password" id="password" name="password" placeholder="••••••••••••" autocomplete="current-password" required>
    </div>

    <div class="error-msg" id="error-msg">ACCESS DENIED — CHECK CREDENTIALS</div>

    <button type="submit" class="submit-btn">AUTHENTICATE</button>
  </form>
</div>

<script>

  const form = document.getElementById("login-form");
  const errorMsg = document.getElementById("error-msg");

  form.addEventListener("submit",async function (e) {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const credentials = { username:username, password:password };
    const jsonText = JSON.stringify(credentials);
    const response = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: jsonText
      
    });
    if (response.ok) {
      window.location.href = "/dashboard";
    }
    
   else {
      errorMsg.classList.add("visible");
    }
  });
</script>
